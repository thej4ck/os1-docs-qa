<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso MCP — {{ product }}</title>
  <style>
    :root { --red:#E2231A; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
           background:#f5f5f7; color:#1d1d1f; display:flex; min-height:100vh;
           align-items:center; justify-content:center; }
    .card { background:#fff; border-radius:14px; padding:36px 32px; width:100%; max-width:380px;
            box-shadow:0 8px 30px rgba(0,0,0,.08); }
    h1 { font-size:19px; margin:0 0 4px; }
    p.sub { margin:0 0 22px; color:#6e6e73; font-size:14px; }
    label { display:block; font-size:13px; color:#6e6e73; margin:0 0 6px; }
    input[type=email], input[type=text] { width:100%; padding:12px 14px; font-size:15px;
            border:1px solid #d2d2d7; border-radius:9px; margin:0 0 16px; }
    input[type=text] { letter-spacing:6px; text-align:center; font-family:'JetBrains Mono',monospace; }
    button { width:100%; padding:12px; font-size:15px; font-weight:600; color:#fff;
             background:var(--red); border:none; border-radius:9px; cursor:pointer; }
    .err { background:#fff0ef; color:var(--red); border-radius:8px; padding:10px 12px;
           font-size:13px; margin:0 0 16px; }
    .scope { font-size:12px; color:#6e6e73; margin-top:18px; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ product }}</h1>
    <p class="sub">Autorizza l'accesso in <strong>sola lettura</strong> alla documentazione.</p>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    {% if stage == 'email' %}
    <form method="post" action="/mcp-login">
      <input type="hidden" name="ticket" value="{{ ticket }}">
      <input type="hidden" name="step" value="email">
      <label for="email">Email aziendale</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autofocus
             placeholder="nome@azienda.it">
      <button type="submit">Continua</button>
    </form>
    {% else %}
    <form method="post" action="/mcp-login">
      <input type="hidden" name="ticket" value="{{ ticket }}">
      <input type="hidden" name="step" value="otp">
      <input type="hidden" name="email" value="{{ email }}">
      <label for="code">Codice inviato a {{ email }}</label>
      <input type="text" id="code" name="code" required autofocus inputmode="numeric"
             maxlength="6" placeholder="000000">
      <button type="submit">Autorizza</button>
    </form>
    {% endif %}

    <div class="scope">Permesso richiesto: <code>docs:read</code></div>
  </div>
</body>
</html>
