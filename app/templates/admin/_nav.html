{# Shared admin navigation. Active state derived from request path —
   no per-route context needed. CSS lives globally in base.html (.admin-nav). #}
{% set _p = request.url.path %}
<nav class="admin-nav">
    <a href="/admin"{% if _p == '/admin' %} class="active"{% endif %}>Dashboard</a>
    <a href="/admin/users"{% if _p.startswith('/admin/users') %} class="active"{% endif %}>Utenti</a>
    <a href="/admin/usage"{% if _p.startswith('/admin/usage') %} class="active"{% endif %}>Consumi</a>
    <a href="/admin/domains"{% if _p.startswith('/admin/domains') %} class="active"{% endif %}>Domini</a>
    <a href="/admin/mcp"{% if _p.startswith('/admin/mcp') %} class="active"{% endif %}>MCP</a>
    <a href="/admin/costs"{% if _p.startswith('/admin/costs') %} class="active"{% endif %}>Costi</a>
    <a href="/admin/feedback"{% if _p.startswith('/admin/feedback') %} class="active"{% endif %}>Feedback</a>
    <a href="/admin/announcement"{% if _p.startswith('/admin/announcement') %} class="active"{% endif %}>Impostazioni</a>
</nav>
