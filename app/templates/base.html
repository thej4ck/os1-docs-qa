<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OS1 Docs{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ═══════════════ Reset ═══════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.7;
            color: var(--c-text);
            background: var(--c-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.005em;
        }
        a { color: var(--c-brand); text-decoration: none; transition: color 150ms ease; }
        a:hover { color: var(--c-brand-hover); }
        img, svg { display: block; max-width: 100%; }
        ul, ol { list-style: none; }
        button, input, textarea, select { font: inherit; color: inherit; border: none; background: none; outline: none; }
        button { cursor: pointer; }
        ::selection { background: var(--c-brand-light); color: var(--c-brand); }

        /* ═══════════════ SCAO Design Tokens ═══════════════ */
        :root {
            /* Editorial type system */
            --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            --font-sans:  'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono:  'JetBrains Mono', ui-monospace, monospace;

            /* Paper & ink — light */
            --c-bg:             #F4F0E7;   /* warm paper */
            --c-surface:        #FCFAF4;   /* the page */
            --c-surface-alt:    #ECE6D8;   /* warm sink */
            --c-surface-raised: #FCFAF4;
            --c-border:         #DDD6C4;   /* warm hairline */
            --c-border-input:   #C7BEA8;
            --c-text:           #211D17;   /* warm ink */
            --c-text-secondary: #5A5240;
            --c-text-tertiary:  #8C8472;
            --c-brand:          #E2231A;   /* SCAO red — unchanged */
            --c-brand-hover:    #B81C14;
            --c-brand-light:    #F7E6E3;   /* red tint on paper */
            --c-brand-surface:  #EDCFCB;
            --c-link:           #B81C14;
            --c-error:          #B81C14;
            --c-error-bg:       #F7E6E3;
            --c-error-border:   #EDCFCB;
            --c-accent-dark:    #2A2620;   /* code ink block */
            --c-warm:           #FBF7EE;   /* answer "page" */
            --c-success:        #16A34A;   /* status ok / active */
            --c-success-bg:     #F0FDF4;
            --c-warning:        #F59E0B;   /* attention / amber */
            --c-shadow-sm:      none;
            --c-shadow:         0 1px 0 rgba(33,29,23,0.04);
            --c-shadow-lg:      0 8px 32px rgba(33,29,23,0.10);
            --c-shadow-up:      0 -1px 0 rgba(33,29,23,0.05);

            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

            --r-sm: 3px; --r-md: 5px; --r-lg: 8px; --r-xl: 12px; --r-full: 9999px;
        }

        /* ═══════════════ Dark Theme — night reading ═══════════════ */
        [data-theme="dark"] {
            --c-bg:             #14120E;   /* dark sepia-charcoal */
            --c-surface:        #1B1813;
            --c-surface-alt:    #232019;
            --c-surface-raised: #232019;
            --c-border:         #353026;
            --c-border-input:   #494331;
            --c-text:           #ECE5D4;   /* warm light ink */
            --c-text-secondary: #ADA48C;
            --c-text-tertiary:  #7B7560;
            --c-brand:          #F0463C;   /* SCAO red — brightened for night */
            --c-brand-hover:    #F4756C;
            --c-brand-light:    rgba(240,70,60,0.14);
            --c-brand-surface:  rgba(240,70,60,0.10);
            --c-link:           #F0463C;
            --c-error:          #F0463C;
            --c-error-bg:       rgba(240,70,60,0.12);
            --c-error-border:   rgba(240,70,60,0.22);
            --c-accent-dark:    #0F0E0B;
            --c-warm:           #1E1B15;
            --c-success:        #34D399;   /* status ok / active — night */
            --c-success-bg:     rgba(52,211,153,0.12);
            --c-warning:        #FBBF24;
            --c-shadow-sm:      none;
            --c-shadow:         0 1px 0 rgba(0,0,0,0.3);
            --c-shadow-lg:      0 8px 32px rgba(0,0,0,0.45);
            --c-shadow-up:      0 -1px 0 rgba(0,0,0,0.3);
        }
        [data-theme="dark"] .brand-logo { filter: brightness(1.3) saturate(1.2); }
        [data-theme="dark"] .auth-logo { filter: brightness(1.3) saturate(1.2); }
        [data-theme="dark"] .welcome-logo { filter: brightness(1.3) saturate(1.2); }
        [data-theme="dark"] .doc-overlay-backdrop { background: rgba(0,0,0,0.6); }
        [data-theme="dark"] .doc-overlay-card { background: #1A1D27; }
        [data-theme="dark"] .doc-overlay-header { background: #22252F; }
        [data-theme="dark"] .doc-overlay-body { background: #0F1117; }
        [data-theme="dark"] .msg-assistant .msg-content { background: var(--c-warm); border-color: var(--c-border); }
        [data-theme="dark"] .msg-assistant .msg-content code { color: #EF4444; background: #22252F; }
        [data-theme="dark"] .msg-assistant .msg-content pre { background: #0D0F14; }
        [data-theme="dark"] .msg-assistant .msg-content th { background: var(--c-surface-alt); color: var(--c-text-secondary); }
        [data-theme="dark"] .msg-assistant .msg-content td { border-color: var(--c-border); }
        [data-theme="dark"] .msg-assistant .msg-content blockquote { border-left-color: var(--c-brand); color: var(--c-text-secondary); }
        [data-theme="dark"] .msg-assistant .msg-content table { border-color: var(--c-border); }
        [data-theme="dark"] .msg-assistant .msg-content hr { border-top-color: var(--c-border); }
        [data-theme="dark"] .msg-user .msg-avatar { background: rgba(239,68,68,0.15); }
        [data-theme="dark"] .msg-assistant .msg-avatar { background: #E4E6EB; color: #1A1D27; }
        [data-theme="dark"] .chat-sidebar { border-right-color: #3A3E4C; }
        [data-theme="dark"] .docs-panel { border-left-color: #3A3E4C; }
        [data-theme="dark"] .btn-send:hover { box-shadow: 0 0 14px rgba(239,68,68,0.35); }
        [data-theme="dark"] .scroll-fab { background: var(--c-surface-raised); border-color: var(--c-border); }
        [data-theme="dark"] .toast.info { background: #3A3E4C; }

        /* Theme toggle button */
        .theme-toggle {
            background: none; border: none; color: var(--c-text-secondary);
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: var(--r-sm);
            transition: background 120ms ease, color 120ms ease;
        }
        .theme-toggle:hover { color: var(--c-text); background: var(--c-surface-alt); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* ═══════════════ Layout ═══════════════ */
        .container { max-width: 880px; margin: 0 auto; padding: 0 var(--sp-4); width: 100%; }
        main { flex: 1; }

        /* ═══════════════ Header ═══════════════ */
        .app-header {
            height: 56px;
            background: var(--c-surface);
            border-bottom: 2px solid var(--c-brand);   /* the red thread */
            position: sticky; top: 0; z-index: 100;
        }
        .app-header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 100%; width: 100%; padding: 0 var(--sp-5); gap: var(--sp-4);
        }
        .header-left { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
        .header-right { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
        .header-divider {
            width: 1px; height: 22px; background: var(--c-border);
            margin: 0 var(--sp-1); flex-shrink: 0;
        }
        .usage-meter {
            display: flex; align-items: center; gap: var(--sp-2);
            flex-shrink: 0; cursor: default;
        }
        .usage-meter-track {
            width: 96px; height: 4px; border-radius: var(--r-full);
            background: var(--c-surface-alt); overflow: hidden;
        }
        .usage-meter-fill {
            height: 100%; width: 0; border-radius: var(--r-full);
            background: var(--c-brand); opacity: 0.55;
            transition: width 400ms cubic-bezier(0.16,1,0.3,1), opacity 200ms ease;
        }
        .usage-meter.warn .usage-meter-fill { opacity: 0.85; }
        .usage-meter.danger .usage-meter-fill { opacity: 1; }
        .usage-meter-label {
            font-family: var(--font-sans); font-size: 0.6875rem; font-weight: 600;
            color: var(--c-text-tertiary); min-width: 28px; text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .usage-meter.danger .usage-meter-label { color: var(--c-brand); }
        .brand {
            display: flex; align-items: center; gap: var(--sp-3);
            font-family: var(--font-serif); font-weight: 700; font-size: 1.0625rem;
            color: var(--c-text); text-decoration: none; letter-spacing: -0.02em;
            padding: 4px var(--sp-2); border-radius: var(--r-sm);
            transition: background 120ms ease;
        }
        .brand:hover { text-decoration: none; color: var(--c-text); background: var(--c-surface-alt); }
        .brand-logo { height: 20px; width: auto; }
        .beta-badge {
            display: inline-flex; align-items: center;
            font-family: var(--font-sans); font-size: 0.625rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 2px 6px; border-radius: var(--r-sm);
            background: var(--c-brand-light); color: var(--c-brand);
            border: 1px solid var(--c-brand-surface);
            line-height: 1;
        }
        .beta-badge-lg {
            display: inline-flex; align-items: center;
            font-family: var(--font-sans); font-size: 0.6875rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            padding: 3px 8px; border-radius: var(--r-sm);
            background: var(--c-brand-light); color: var(--c-brand);
            border: 1px solid var(--c-brand-surface);
            line-height: 1; vertical-align: middle; margin-left: 8px;
        }
        .header-email {
            font-size: 0.8125rem; color: var(--c-text-secondary); font-weight: 500;
            padding: 0 var(--sp-2); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 240px;
        }
        .header-email-btn {
            background: none; border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: var(--r-full); transition: color 150ms ease, background 150ms ease;
        }
        .header-email-btn:hover { color: var(--c-text); background: var(--c-surface-alt); }
        .header-email-btn span { font-size: 0.75rem; opacity: 0.7; }

        /* ── Access link modal ── */
        .access-modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; align-items: center; justify-content: center;
            z-index: 200; padding: var(--sp-4);
        }
        .access-modal-backdrop.active { display: flex; animation: fadeIn 150ms ease; }
        .access-modal {
            background: var(--c-surface); border: 1px solid var(--c-border);
            border-radius: var(--r-lg); box-shadow: var(--c-shadow-lg);
            max-width: 480px; width: 100%; padding: var(--sp-6);
            animation: overlayIn 200ms cubic-bezier(0.16,1,0.3,1);
        }
        .access-modal h3 {
            font-family: var(--font-serif); font-size: 1.125rem;
            color: var(--c-text); margin-bottom: var(--sp-2);
        }
        .access-modal p {
            font-size: 0.875rem; color: var(--c-text-secondary);
            line-height: 1.6; margin-bottom: var(--sp-4);
        }
        .access-url-row { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }
        .access-url-input {
            flex: 1; font-size: 0.8125rem; font-family: 'JetBrains Mono', monospace;
            padding: 10px 12px; border: 1px solid var(--c-border-input);
            border-radius: var(--r-sm); background: var(--c-surface-alt);
            color: var(--c-text); overflow: hidden; text-overflow: ellipsis;
        }
        .access-modal-actions {
            display: flex; justify-content: space-between; align-items: center;
            gap: var(--sp-3);
        }
        .access-regen {
            font-size: 0.8125rem; color: var(--c-text-tertiary);
            background: none; border: none; cursor: pointer; text-decoration: underline;
        }
        .access-regen:hover { color: var(--c-error); }
        .btn-logout {
            font-size: 0.8125rem; font-weight: 500; color: var(--c-text-secondary);
            padding: 5px 14px; border: 1px solid var(--c-border); border-radius: var(--r-full);
            transition: all 150ms ease; text-decoration: none; white-space: nowrap;
        }
        .btn-logout:hover { color: var(--c-text); border-color: var(--c-border-input); background: var(--c-surface-alt); text-decoration: none; }

        /* ═══════════════ Auth Pages ═══════════════ */
        .auth-page {
            min-height: calc(100vh - 56px);
            display: flex; align-items: center; justify-content: center;
            padding: var(--sp-6); background: var(--c-bg);
        }
        .auth-card {
            background: var(--c-surface); border: 1px solid var(--c-border);
            border-radius: var(--r-lg); box-shadow: var(--c-shadow);
            padding: var(--sp-10); max-width: 400px; width: 100%;
        }
        .auth-header { text-align: center; margin-bottom: var(--sp-8); }
        .auth-logo { height: 44px; width: auto; margin: 0 auto var(--sp-5); }
        .auth-icon {
            width: 52px; height: 52px; margin: 0 auto var(--sp-5);
            background: var(--c-brand-light); border-radius: var(--r-md);
            display: flex; align-items: center; justify-content: center; color: var(--c-brand);
        }
        .auth-icon svg { width: 24px; height: 24px; }
        .auth-header h1 { font-size: 1.375rem; margin-bottom: var(--sp-2); color: var(--c-text); }
        .auth-header p { font-size: 0.9375rem; color: var(--c-text-secondary); line-height: 1.5; }
        .auth-header strong { color: var(--c-text); font-weight: 600; }

        /* ═══════════════ Forms ═══════════════ */
        .form-group { margin-bottom: var(--sp-5); }
        .form-group label {
            display: block; font-size: 0.8125rem; font-weight: 600;
            margin-bottom: var(--sp-2); color: var(--c-text); letter-spacing: 0.01em;
        }
        .form-input {
            width: 100%; padding: 10px var(--sp-3); font-size: 0.9375rem;
            border: 1.5px solid var(--c-border-input); border-radius: var(--r-sm);
            background: var(--c-surface); transition: border-color 150ms ease, box-shadow 150ms ease;
        }
        .form-input::placeholder { color: var(--c-text-tertiary); }
        .form-input:focus { border-color: var(--c-brand); box-shadow: 0 0 0 3px rgba(226,35,26,0.1); }
        .form-input-otp {
            text-align: center; font-size: 1.5rem; font-family: var(--font-serif);
            font-weight: 600; letter-spacing: 10px; padding: 12px var(--sp-4);
        }

        /* ═══════════════ Buttons ═══════════════ */
        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
            padding: 11px var(--sp-6); font-size: 0.9375rem; font-weight: 600;
            font-family: var(--font-serif); color: white; background: var(--c-brand);
            border-radius: var(--r-sm); transition: background-color 150ms ease, box-shadow 150ms ease, transform 80ms ease;
        }
        .btn-primary:hover { background: var(--c-brand-hover); text-decoration: none; box-shadow: var(--c-shadow-sm); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:focus-visible { box-shadow: 0 0 0 3px rgba(226,35,26,0.25); }
        .suggestion-chip:focus-visible, .feedback-btn:focus-visible,
        .disambig-chip:focus-visible, .msg-action-btn:focus-visible,
        .welcome-tips-toggle > summary:focus-visible {
            outline: none; box-shadow: 0 0 0 3px rgba(226,35,26,0.25);
        }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .btn-full { width: 100%; }

        /* ═══════════════ Alerts ═══════════════ */
        .alert-error {
            display: flex; align-items: flex-start; gap: var(--sp-2);
            padding: var(--sp-3) var(--sp-4); background: var(--c-error-bg);
            border: 1px solid var(--c-error-border); color: var(--c-error);
            border-radius: var(--r-sm); font-size: 0.875rem; font-weight: 500;
            margin-bottom: var(--sp-5); line-height: 1.4;
        }
        .alert-error svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

        /* ═══════════════ Chat Layout (3 panels) ═══════════════ */
        .chat-layout { display: flex; height: calc(100vh - 56px); }

        /* Left sidebar */
        .chat-sidebar {
            width: 260px; flex-shrink: 0; background: var(--c-surface);
            border-right: 1px solid var(--c-border);
            display: flex; flex-direction: column; overflow: hidden;
            transition: width 0.25s cubic-bezier(0.16,1,0.3,1), padding 0.25s ease, border 0.25s ease;
        }
        .chat-sidebar.collapsed {
            width: 0; border-right-width: 0; padding: 0;
        }
        .chat-sidebar.collapsed > * { opacity: 0; pointer-events: none; }

        /* Center panel */
        .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .chat-wrap {
            display: flex; flex-direction: column; height: 100%;
            max-width: 100%; padding: 0 var(--sp-4);
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: var(--sp-6) 0 var(--sp-4);
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }

        /* Right docs panel */
        .docs-panel {
            width: 280px; flex-shrink: 0; background: var(--c-surface);
            border-left: 1px solid var(--c-border);
            display: flex; flex-direction: column; overflow: hidden;
            transition: width 0.25s cubic-bezier(0.16,1,0.3,1), padding 0.25s ease, border 0.25s ease;
        }
        .docs-panel.collapsed {
            width: 0; border-left-width: 0; padding: 0;
        }
        .docs-panel.collapsed > * { opacity: 0; pointer-events: none; }
        .docs-panel-header {
            padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-border);
            font-family: var(--font-sans); font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--c-text-secondary); display: flex; align-items: center; gap: var(--sp-2);
        }
        .docs-panel-header span { font-weight: 400; color: var(--c-text-tertiary); }
        .docs-panel-list {
            flex: 1; overflow-y: auto; padding: var(--sp-2);
        }
        .docs-panel-list::-webkit-scrollbar { width: 4px; }
        .docs-panel-list::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }
        .doc-card {
            padding: var(--sp-3); border-radius: var(--r-sm);
            border: 1px solid var(--c-border); margin-bottom: var(--sp-2);
            cursor: pointer; transition: all 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }
        .doc-card { border-left: 3px solid transparent; }
        .doc-card:hover { border-color: var(--c-border); border-left-color: var(--c-brand); background: var(--c-surface-alt); }
        .doc-card-title {
            font-size: 0.8125rem; font-weight: 500; color: var(--c-text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .doc-card-file {
            font-size: 0.6875rem; color: var(--c-text-tertiary); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .docs-empty {
            padding: var(--sp-8) var(--sp-4); text-align: center;
            font-size: 0.8125rem; color: var(--c-text-tertiary); line-height: 1.5;
        }
        .docs-toggle-btn {
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; color: var(--c-text-secondary);
            width: 40px; height: 40px; border-radius: var(--r-sm);
            position: relative; cursor: pointer;
            transition: background 120ms ease, color 120ms ease;
        }
        .docs-toggle-btn:hover { color: var(--c-text); background: var(--c-surface-alt); }
        .docs-badge {
            position: absolute; top: -2px; right: -2px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--c-brand); color: white; font-size: 0.5625rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            display: none;
        }

        /* ═══════════════ Messages — document flow ═══════════════ */
        .msg {
            display: block; max-width: 760px;
            margin: 0 auto var(--sp-8);
            animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .msg-avatar { display: none; }   /* editorial: no chat avatars */
        .msg-body { min-width: 0; max-width: 100%; }
        /* eyebrow labels — quiet wayfinding */
        .msg-body::before {
            display: block; font-family: var(--font-sans);
            font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; margin-bottom: var(--sp-2);
        }
        .msg-user .msg-body::before {
            content: "La tua domanda"; color: var(--c-brand);
        }
        .msg-assistant .msg-body::before {
            content: "Risposta dal manuale OS1"; color: var(--c-text-tertiary);
        }
        .msg-content { font-size: 1.0625rem; }
        .msg-user .msg-content {
            background: none; color: var(--c-text-secondary);
            border-left: 3px solid var(--c-brand);
            padding: 2px 0 2px var(--sp-4);
            font-family: var(--font-serif); font-style: italic;
            font-size: 1.0625rem; line-height: 1.6;
        }
        .msg-assistant .msg-content {
            background: none; border: none; box-shadow: none; padding: 0;
            line-height: 1.75;
        }

        /* Markdown */
        .msg-assistant .msg-content p { margin: 0.4em 0; }
        .msg-assistant .msg-content p:first-child { margin-top: 0; }
        .msg-assistant .msg-content p:last-child { margin-bottom: 0; }
        .msg-assistant .msg-content ul, .msg-assistant .msg-content ol {
            list-style: revert; padding-left: 1.4em; margin: 0.5em 0;
        }
        .msg-assistant .msg-content li { margin-bottom: 0.25em; }
        .msg-assistant .msg-content strong { font-weight: 600; color: var(--c-text); }
        .msg-assistant .msg-content code {
            background: var(--c-surface-alt); padding: 1px 5px; border-radius: 3px;
            font-size: 0.85em; font-family: var(--font-mono); color: var(--c-brand);
        }
        .msg-assistant .msg-content pre {
            background: var(--c-accent-dark); color: #ECE5D4; padding: var(--sp-3) var(--sp-4);
            border-radius: var(--r-sm); overflow-x: auto; margin: 0.7em 0;
            font-size: 0.83em; line-height: 1.55; font-family: var(--font-mono);
        }
        .msg-assistant .msg-content pre code { background: none; padding: 0; color: inherit; }
        .msg-assistant .msg-content table {
            border-collapse: collapse; margin: 0.7em 0; font-size: 0.875em; width: 100%;
        }
        .msg-assistant .msg-content th, .msg-assistant .msg-content td {
            border: 1px solid var(--c-border); padding: 6px 10px; text-align: left;
        }
        .msg-assistant .msg-content th { background: var(--c-surface-alt); font-weight: 600; font-size: 0.85em; }
        .msg-assistant .msg-content h1, .msg-assistant .msg-content h2,
        .msg-assistant .msg-content h3, .msg-assistant .msg-content h4 {
            font-family: var(--font-serif); margin: 1em 0 0.3em; font-weight: 600;
        }
        .msg-assistant .msg-content h1 { font-size: 1.1em; }
        .msg-assistant .msg-content h2 { font-size: 1.05em; }
        .msg-assistant .msg-content h3, .msg-assistant .msg-content h4 { font-size: 1em; }
        .msg-assistant .msg-content h1:first-child, .msg-assistant .msg-content h2:first-child,
        .msg-assistant .msg-content h3:first-child { margin-top: 0; }
        .msg-assistant .msg-content blockquote {
            border-left: 3px solid var(--c-brand); padding-left: var(--sp-3);
            margin: 0.5em 0; color: var(--c-text-secondary);
        }
        .msg-assistant .msg-content hr { border: none; border-top: 1px solid var(--c-border); margin: 0.8em 0; }
        .msg-assistant .msg-content img {
            display: block; max-width: 100%; height: auto; margin: 0.8em 0;
            border: 1px solid var(--c-border); border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] .msg-assistant .msg-content img {
            border-color: var(--c-border); box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ═══════════════ Screenshot panel ═══════════════ */
        .msg.has-screenshots-msg { display: flex; gap: 20px; max-width: 100%; align-items: flex-start; }
        .msg.has-screenshots-msg .msg-body { flex: 1; min-width: 0; max-width: none; }
        .msg-screenshots {
            flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0;
        }
        .screenshot-thumb { cursor: pointer; border: 1px solid var(--c-border); border-radius: 8px; overflow: hidden; background: var(--c-surface-alt); transition: box-shadow 0.15s; }
        .screenshot-thumb:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
        .screenshot-thumb img { display: block; width: 100%; height: auto; }
        .screenshot-label { display: block; padding: 5px 8px; font-size: 0.75rem; color: var(--c-text-secondary); text-align: center; border-top: 1px solid var(--c-border); }
        .img-lightbox {
            position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(6px);
        }
        .img-lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .img-lightbox-caption { color: #fff; margin-top: 12px; font-size: 0.9rem; text-align: center; }
        @media (max-width: 900px) { .msg.has-screenshots-msg { flex-direction: column; } .msg-screenshots { flex-direction: row; overflow-x: auto; } .screenshot-thumb { min-width: 220px; flex-shrink: 0; } }

        /* ═══════════════ Thinking indicator ═══════════════ */
        .thinking-dots { display: flex; gap: 5px; padding: 6px 0; align-items: center; }
        .thinking-dots span {
            width: 7px; height: 7px; background: var(--c-text-tertiary);
            border-radius: 50%; animation: dotPulse 1.4s ease-in-out infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        .thinking-bar {
            display: flex; align-items: center; gap: 8px; padding: 8px 0;
        }
        .thinking-bar-line {
            width: 48px; height: 3px; border-radius: 2px; background: var(--c-border);
            overflow: hidden; position: relative;
        }
        .thinking-bar-line::after {
            content: ''; position: absolute; left: -50%; top: 0; width: 50%; height: 100%;
            background: var(--c-brand); border-radius: 2px;
            animation: thinkSlide 1.2s ease-in-out infinite;
        }
        .thinking-bar-text {
            font-size: 0.75rem; color: var(--c-text-tertiary); font-family: var(--font-sans);
        }
        @keyframes thinkSlide { 0% { left: -50%; } 100% { left: 100%; } }

        /* ═══════════════ Message actions (copy/print) ═══════════════ */
        .msg-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
        .msg-action-btn {
            padding: 6px 12px; border-radius: var(--r-full);
            background: var(--c-surface); border: 1px solid var(--c-border);
            color: var(--c-text-secondary); font-size: 0.75rem; font-weight: 500;
            cursor: pointer; transition: all 150ms ease;
        }
        .msg-action-btn:hover { border-color: var(--c-brand); color: var(--c-brand); background: var(--c-brand-light); }

        /* ═══════════════ Feedback ═══════════════ */
        @keyframes pulse-feedback { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .msg-feedback { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
        .feedback-btn {
            padding: 8px 14px; border-radius: var(--r-full); color: #16A34A;
            cursor: pointer; transition: all 180ms ease; background: #F0FDF4;
            border: 1.5px solid #BBF7D0; display: flex; align-items: center; gap: 4px;
            font-size: 0.8125rem; font-weight: 500;
        }
        .feedback-btn:last-child { color: var(--c-error); background: var(--c-error-bg); border-color: #FECACA; }
        .feedback-btn:hover { transform: scale(1.1); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .feedback-btn.active-up { color: #fff; background: #16A34A; border-color: #16A34A; animation: none; transform: scale(1); }
        .feedback-btn.active-down { color: #fff; background: var(--c-error); border-color: var(--c-error); animation: none; transform: scale(1); }
        .feedback-btn[style*="pointer-events"] { animation: none; }
        .feedback-btn svg { width: 14px; height: 14px; }
        [data-theme="dark"] .feedback-btn { background: rgba(22,163,74,0.1); border-color: rgba(22,163,74,0.3); }
        [data-theme="dark"] .feedback-btn:last-child { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }

        /* Feedback detail form */
        .feedback-form {
            margin-top: var(--sp-2); padding: var(--sp-3);
            background: var(--c-surface-alt); border: 1px solid var(--c-border);
            border-radius: var(--r-md); animation: fadeIn 150ms ease;
        }
        .feedback-chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-bottom: var(--sp-2); }
        .feedback-chip {
            font-size: 0.75rem; padding: 4px 10px; border-radius: var(--r-full);
            border: 1px solid var(--c-border); background: var(--c-surface);
            color: var(--c-text-secondary); cursor: pointer; transition: all 120ms ease;
        }
        .feedback-chip:hover { border-color: var(--c-brand); color: var(--c-brand); }
        .feedback-chip.selected { background: var(--c-brand); color: white; border-color: var(--c-brand); }
        .feedback-comment {
            width: 100%; resize: vertical; min-height: 48px; max-height: 120px;
            font-size: 0.8125rem; padding: var(--sp-2); border-radius: var(--r-sm);
            border: 1px solid var(--c-border); background: var(--c-surface);
            color: var(--c-text); font-family: inherit; box-sizing: border-box;
        }
        .feedback-comment::placeholder { color: var(--c-text-tertiary); }
        .feedback-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }
        .feedback-submit {
            font-size: 0.75rem; padding: 4px 12px; border-radius: var(--r-sm);
            background: var(--c-brand); color: white; border: none; cursor: pointer; font-weight: 500;
        }
        .feedback-submit:hover { opacity: 0.9; }
        .feedback-cancel {
            font-size: 0.75rem; padding: 4px 12px; border-radius: var(--r-sm);
            background: none; color: var(--c-text-secondary); border: 1px solid var(--c-border); cursor: pointer;
        }
        .feedback-charcount { font-size: 0.6875rem; color: var(--c-text-tertiary); text-align: right; margin-top: 2px; }

        /* ═══════════════ Welcome ═══════════════ */
        .welcome {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: var(--sp-12) var(--sp-4) var(--sp-10);
            animation: fadeIn 0.5s ease-out;
            transition: opacity 0.3s ease, transform 0.3s ease;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--c-warm) 0%, transparent 70%);
        }
        .welcome.hiding { opacity: 0; transform: translateY(-16px); pointer-events: none; }
        .welcome-logo { height: 40px; width: auto; margin-bottom: var(--sp-6); opacity: 0.9; }
        .welcome h2 {
            font-size: 2.5rem; margin-bottom: var(--sp-4); color: var(--c-text);
            letter-spacing: -0.01em; font-weight: 600;
        }
        .welcome h2::after {
            content: ''; display: block; width: 48px; height: 2px;
            background: var(--c-brand); margin: var(--sp-4) auto 0;
        }
        .welcome p {
            color: var(--c-text-secondary); margin-bottom: var(--sp-8);
            font-size: 1.0625rem; max-width: 480px; line-height: 1.65;
        }
        .suggestion-chips {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: var(--sp-3); max-width: 520px; width: 100%;
        }
        .suggestion-chip {
            font-size: 0.9375rem; font-weight: 400; color: var(--c-text);
            background: var(--c-surface); border: 1px solid var(--c-border);
            border-left: 3px solid transparent;
            border-radius: var(--r-sm); padding: 14px 16px; cursor: pointer;
            transition: border-color 150ms ease, background 150ms ease; text-align: left;
            display: flex; align-items: flex-start; gap: var(--sp-2);
            line-height: 1.45;
        }
        .suggestion-chip:hover {
            border-color: var(--c-border); border-left-color: var(--c-brand);
            background: var(--c-surface-alt);
        }
        .suggestion-chip .chip-icon {
            font-size: 1.1em; flex-shrink: 0; margin-top: 1px;
        }

        /* ═══════════════ Welcome starters & tips ═══════════════ */
        .welcome-starters-label {
            font-family: var(--font-serif); font-weight: 600;
            font-size: 0.875rem; color: var(--c-text-secondary);
            margin-bottom: var(--sp-3); align-self: flex-start;
            max-width: 520px; width: 100%;
        }
        .welcome-tips-toggle {
            margin-top: var(--sp-5); max-width: 520px; width: 100%;
            text-align: left; font-size: 0.875rem;
        }
        .welcome-tips-toggle > summary {
            list-style: none; cursor: pointer; color: var(--c-text-secondary);
            font-family: var(--font-serif); font-weight: 600;
            padding: var(--sp-2) 0; transition: color 150ms ease;
        }
        .welcome-tips-toggle > summary::-webkit-details-marker { display: none; }
        .welcome-tips-toggle > summary::before { content: '▸ '; color: var(--c-brand); }
        .welcome-tips-toggle[open] > summary::before { content: '▾ '; }
        .welcome-tips-toggle > summary:hover { color: var(--c-text); }
        .welcome-tips-body {
            display: flex; flex-direction: column; gap: var(--sp-2);
            padding: var(--sp-3) 0 0; color: var(--c-text-secondary);
            line-height: 1.5;
        }
        .welcome-tips-body > div { display: flex; gap: var(--sp-2); align-items: flex-start; }
        .welcome-tips-body > div > span { flex-shrink: 0; }
        .welcome p.welcome-warning {
            font-size: 0.8125rem; color: var(--c-text-tertiary);
            max-width: 560px; margin: var(--sp-8) auto 0;
            line-height: 1.7; padding: var(--sp-4) 0 0;
            border-top: 1px solid var(--c-border); text-align: center;
        }
        .welcome p.welcome-warning strong { color: var(--c-text); font-weight: 600; }
        @media (max-width: 768px) {
            .welcome-tips { grid-template-columns: 1fr; }
        }
        /* Disambiguation */
        .disambig-container { }
        .disambig-header { font-size: 0.9rem; margin-bottom: var(--sp-2); color: var(--c-text); }
        .disambig-question { font-size: 0.85rem; color: var(--c-text-secondary); margin-bottom: var(--sp-3); line-height: 1.5; }
        .disambig-options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--sp-3); }
        .disambig-chip {
            font-size: 0.8125rem; padding: 10px 16px; border-radius: var(--r-md);
            border: 1.5px solid var(--c-border); background: var(--c-surface);
            color: var(--c-text); cursor: pointer; transition: all 180ms ease;
            display: flex; align-items: center; gap: 8px; font-weight: 500;
        }
        .disambig-chip:hover { border-color: var(--c-brand); color: var(--c-brand); background: var(--c-surface-alt); }
        .disambig-icon { font-size: 1.1em; }
        .disambig-skip {
            font-size: 0.75rem; color: var(--c-text-tertiary); background: none;
            border: none; cursor: pointer; padding: 4px 0; transition: color 150ms;
        }
        .disambig-skip:hover { color: var(--c-brand); }
        /* Clickable source links in chat */
        .source-link {
            color: var(--c-brand); text-decoration: none; font-style: normal;
            cursor: pointer; border-bottom: 1px solid var(--c-brand-surface);
            transition: border-color 150ms; padding-bottom: 1px; font-weight: 600;
        }
        .source-link::before {
            content: '▌'; color: var(--c-brand); margin-right: 2px;
            font-size: 0.85em;
        }
        .source-link:hover { border-bottom-color: var(--c-brand); }
        /* Onboarding overlay */
        .onboarding-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 300ms ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .onboarding-card {
            background: var(--c-surface); border-radius: var(--r-lg);
            box-shadow: 0 24px 64px rgba(0,0,0,0.2); max-width: 480px; width: 92%;
            padding: 40px 36px 32px; position: relative; overflow: hidden;
            animation: slideUp 400ms ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
        .onboarding-skip {
            position: absolute; top: 16px; right: 20px; font-size: 0.75rem;
            color: var(--c-text-tertiary); background: none; border: none;
            cursor: pointer; transition: color 150ms;
        }
        .onboarding-skip:hover { color: var(--c-text); }
        .onboarding-step { display: none; }
        .onboarding-step.active { display: block; animation: fadeIn 250ms ease; }
        .onboarding-logo { height: 36px; width: auto; display: block; margin: 0 auto var(--sp-4); }
        .onboarding-title { font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: var(--sp-2); color: var(--c-text); }
        .onboarding-subtitle { font-size: 0.875rem; text-align: center; color: var(--c-text-secondary); line-height: 1.6; margin-bottom: var(--sp-5); }
        .onboarding-features { display: flex; flex-direction: column; gap: 16px; margin-bottom: var(--sp-5); }
        .onboarding-feature {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 12px 16px; background: var(--c-surface-alt);
            border-radius: var(--r-md); border: 1px solid var(--c-border);
        }
        .onboarding-feature-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
        .onboarding-feature-text { font-size: 0.85rem; color: var(--c-text); line-height: 1.5; }
        .onboarding-feature-text strong { font-weight: 600; }
        .onboarding-warning {
            padding: 16px 20px; background: #FEF3C7; border: 1px solid #F59E0B;
            border-radius: var(--r-md); margin-bottom: var(--sp-4);
            font-size: 0.85rem; line-height: 1.6; color: #92400E;
        }
        [data-theme="dark"] .onboarding-warning { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: #FCD34D; }
        .onboarding-checkbox {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: var(--sp-5); font-size: 0.85rem; color: var(--c-text-secondary);
            cursor: pointer;
        }
        .onboarding-checkbox input { width: 18px; height: 18px; accent-color: var(--c-brand); cursor: pointer; }
        .onboarding-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: var(--sp-4); }
        .onboarding-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--c-border); transition: all 200ms;
        }
        .onboarding-dot.active { background: var(--c-brand); transform: scale(1.3); }
        .onboarding-btn {
            display: block; width: 100%; padding: 12px; border: none;
            border-radius: var(--r-md); font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 180ms; text-align: center;
        }
        .onboarding-btn-primary { background: var(--c-brand); color: #fff; }
        .onboarding-btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(226,35,26,0.2); }
        .onboarding-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .onboarding-nav { display: flex; justify-content: space-between; align-items: center; margin-top: var(--sp-3); }
        .onboarding-back {
            font-size: 0.8rem; color: var(--c-text-tertiary); background: none;
            border: none; cursor: pointer; padding: 4px 0;
        }
        .onboarding-back:hover { color: var(--c-text); }

        /* ═══════════════ Chat Input ═══════════════ */
        .chat-input-wrap { padding: var(--sp-3) 0 var(--sp-4); }
        .chat-input-bar {
            display: flex; align-items: flex-end; gap: var(--sp-2);
            background: var(--c-surface); border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-3);
            box-shadow: var(--c-shadow-up);
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }
        .chat-input-bar:focus-within {
            border-color: var(--c-brand);
            box-shadow: var(--c-shadow-up), 0 0 0 3px rgba(226,35,26,0.06);
        }
        .chat-input-bar textarea {
            flex: 1; resize: none; font-size: 0.9375rem; line-height: 1.5;
            max-height: 120px; padding: 7px 4px; background: transparent; overflow-y: auto;
        }
        .chat-input-bar textarea::placeholder { color: var(--c-text-tertiary); }
        .btn-send {
            width: 44px; height: 44px; border-radius: var(--r-full);
            background: var(--c-brand); color: white;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: background-color 150ms ease, opacity 150ms ease, transform 80ms ease, box-shadow 150ms ease;
        }
        .btn-send:hover { background: var(--c-brand-hover); box-shadow: 0 0 12px rgba(226,35,26,0.3); }
        .btn-send:active { transform: scale(0.9); }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-send svg { width: 18px; height: 18px; }
        .usage-bar {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: var(--sp-2) var(--sp-4); padding-top: var(--sp-2);
            font-family: var(--font-sans); font-size: 0.6875rem;
            color: var(--c-text-tertiary); line-height: 1.4;
        }
        .usage-bar .usage-month {
            text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
        }
        .usage-bar .usage-seg { position: relative; padding-left: var(--sp-4); }
        .usage-bar .usage-seg::before {
            content: ''; position: absolute; left: 0; top: 50%;
            width: 6px; height: 6px; margin-top: -3px; border-radius: 50%;
            background: var(--c-brand);
        }
        .usage-bar .usage-seg b {
            color: var(--c-text-secondary); font-weight: 700;
            margin-right: 4px;
        }
        .chat-input-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: var(--sp-2);
        }
        .chat-input-hint { font-size: 0.6875rem; color: var(--c-text-tertiary); }
        .msg-counter {
            font-size: 0.6875rem; font-weight: 500; color: var(--c-text-tertiary);
            font-family: var(--font-sans);
        }
        .msg-counter.warn { color: #D97706; }
        .msg-counter.danger { color: var(--c-error); }
        .deep-banner {
            margin-bottom: var(--sp-2);
            animation: deepBannerIn 300ms ease;
        }
        @keyframes deepBannerIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .deep-banner-content {
            display: flex; align-items: center; gap: var(--sp-3);
            padding: 8px 12px;
            background: var(--c-surface-alt); border: 1px solid var(--c-border);
            border-radius: var(--r-md); font-size: 0.8125rem;
        }
        .deep-banner-text { color: var(--c-text-secondary); white-space: nowrap; }
        .deep-banner-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: var(--r-full);
            background: var(--c-brand); color: #fff; border: none;
            font-size: 0.8125rem; font-weight: 600; cursor: pointer;
            transition: all 150ms ease; white-space: nowrap;
        }
        .deep-banner-btn:hover { background: var(--c-brand-dark, #c41d16); box-shadow: 0 2px 8px rgba(226,35,26,0.25); }
        .deep-banner-close {
            margin-left: auto; background: none; border: none;
            color: var(--c-text-tertiary); font-size: 1.2rem; cursor: pointer;
            padding: 0 4px; line-height: 1;
        }
        .deep-banner-close:hover { color: var(--c-text); }
        @media (max-width: 640px) {
            .deep-banner-content { flex-wrap: wrap; }
            .deep-banner-text { width: 100%; }
        }

        .limit-banner {
            text-align: center; padding: var(--sp-3) var(--sp-4);
            background: var(--c-brand-light); color: var(--c-brand);
            border-radius: var(--r-sm); font-size: 0.8125rem; font-weight: 500;
            margin-bottom: var(--sp-3); display: none;
        }
        .limit-banner.visible { display: block; }
        .limit-banner a { font-weight: 600; text-decoration: underline; }

        /* ═══════════════ Document Overlay ═══════════════ */
        .doc-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: var(--sp-6);
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .doc-overlay.active { opacity: 1; pointer-events: auto; }
        .doc-overlay-backdrop { position: absolute; inset: 0; background: rgba(15,15,25,0.5); backdrop-filter: blur(6px); }
        .doc-overlay-card {
            position: relative; background: var(--c-surface-alt); border-radius: var(--r-xl);
            box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
            max-width: 780px; width: 100%; max-height: 85vh;
            display: flex; flex-direction: column;
            animation: overlayIn 0.3s cubic-bezier(0.16,1,0.3,1);
            border: 1px solid var(--c-border);
        }
        .doc-overlay-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: var(--sp-4) var(--sp-6);
            background: var(--c-surface); border-bottom: 1px solid var(--c-border);
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            flex-shrink: 0; position: sticky; top: 0; z-index: 1;
        }
        .doc-overlay-title {
            font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700;
            color: var(--c-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: var(--sp-4);
        }
        .doc-overlay-close {
            width: 32px; height: 32px; border-radius: var(--r-full);
            display: flex; align-items: center; justify-content: center;
            color: var(--c-text-secondary); transition: all 150ms ease; flex-shrink: 0;
        }
        .doc-overlay-close:hover { background: var(--c-surface-alt); color: var(--c-text); }
        .doc-overlay-close svg { width: 18px; height: 18px; }
        .doc-overlay-body {
            padding: var(--sp-4); overflow-y: auto; font-size: 0.9375rem; line-height: 1.7;
            background: #F0F2F5;
        }
        .doc-overlay-body p { margin: 0.5em 0; }
        .doc-overlay-body ul, .doc-overlay-body ol { list-style: revert; padding-left: 1.4em; margin: 0.5em 0; }
        .doc-overlay-body code { background: var(--c-surface-alt); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; font-family: 'JetBrains Mono', monospace; }
        .doc-overlay-body pre { background: #1E293B; color: #E2E8F0; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm); overflow-x: auto; margin: 0.7em 0; }
        .doc-overlay-body pre code { background: none; padding: 0; color: inherit; }
        .doc-overlay-body table { border-collapse: collapse; margin: 0.7em 0; font-size: 0.875em; width: 100%; }
        .doc-overlay-body th, .doc-overlay-body td { border: 1px solid var(--c-border); padding: 6px 10px; text-align: left; }
        .doc-overlay-body th { background: var(--c-surface-alt); font-weight: 600; }
        .doc-overlay-body strong { font-weight: 600; }
        .doc-overlay-source {
            font-size: 0.75rem; color: var(--c-text-tertiary);
            padding: var(--sp-3) var(--sp-6) var(--sp-4);
            border-top: 1px solid var(--c-border); flex-shrink: 0;
        }

        /* ═══════════════ Sidebar items ═══════════════ */
        .sidebar-header { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-border); }
        .btn-new-chat {
            display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
            width: 100%; padding: 8px; font-size: 0.8125rem; font-weight: 600;
            font-family: var(--font-serif); color: var(--c-brand); background: none;
            border: 1px solid var(--c-brand-surface); border-radius: var(--r-sm);
            transition: all 150ms ease; cursor: pointer;
        }
        .btn-new-chat:hover { background: var(--c-brand-light); border-color: var(--c-brand); }
        .btn-new-chat svg { width: 14px; height: 14px; }
        .sidebar-search, .docs-search {
            padding: var(--sp-2) var(--sp-3);
            border-bottom: 1px solid var(--c-border);
        }
        .sidebar-search input, .docs-search input {
            width: 100%; font-family: var(--font-sans); font-size: 0.8125rem;
            color: var(--c-text); background: var(--c-surface-alt);
            border: 1px solid var(--c-border); border-radius: var(--r-sm);
            padding: 7px 10px; transition: border-color 150ms ease, box-shadow 150ms ease;
        }
        .sidebar-search input::placeholder, .docs-search input::placeholder { color: var(--c-text-tertiary); }
        .sidebar-search input:focus, .docs-search input:focus {
            outline: none; border-color: var(--c-brand);
            box-shadow: 0 0 0 3px rgba(226,35,26,0.12);
        }
        .list-noresult {
            padding: var(--sp-6) var(--sp-4); text-align: center;
            font-size: 0.8125rem; color: var(--c-text-tertiary);
            font-family: var(--font-serif); font-style: italic;
        }
        .sidebar-list { flex: 1; overflow-y: auto; padding: var(--sp-2); }
        .sidebar-list::-webkit-scrollbar { width: 4px; }
        .sidebar-list::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }
        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer;
            transition: background 120ms ease, transform 120ms ease, padding-left 120ms ease;
            font-size: 0.8125rem;
            color: var(--c-text-secondary); text-decoration: none; overflow: hidden;
        }
        .sidebar-item:hover { background: var(--c-surface-alt); color: var(--c-text); text-decoration: none; padding-left: 12px; }
        .sidebar-item.active { background: none; color: var(--c-text); font-weight: 600; border-left: 3px solid var(--c-brand); padding-left: 12px; }
        .sidebar-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-item-delete {
            opacity: 0; padding: 2px; color: var(--c-text-tertiary);
            transition: opacity 120ms, color 120ms; flex-shrink: 0; margin-left: var(--sp-1);
            cursor: pointer; background: none; border: none;
        }
        .sidebar-item:hover .sidebar-item-delete { opacity: 1; }
        .sidebar-item-delete:hover { color: var(--c-error); }
        .sidebar-item-delete svg { width: 14px; height: 14px; }
        .sidebar-empty { padding: var(--sp-6) var(--sp-4); text-align: center; font-size: 0.8125rem; color: var(--c-text-tertiary); }

        /* ═══════════════ Announcement ═══════════════ */
        .announcement-banner {
            padding: var(--sp-2) var(--sp-4); background: var(--c-brand-light); color: var(--c-brand);
            font-size: 0.8125rem; font-weight: 500; text-align: center;
            border-bottom: 1px solid var(--c-brand-surface); display: none;
        }
        .announcement-banner.visible { display: block; }

        /* ═══════════════ Scroll-to-bottom FAB ═══════════════ */
        .scroll-fab {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) scale(0);
            width: 36px; height: 36px; border-radius: var(--r-full);
            background: var(--c-surface); border: 1px solid var(--c-border);
            box-shadow: var(--c-shadow); color: var(--c-text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
            transition: transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 150ms ease;
            opacity: 0;
        }
        .scroll-fab.visible { transform: translateX(-50%) scale(1); opacity: 1; }
        .scroll-fab:hover { box-shadow: var(--c-shadow-lg); color: var(--c-text); }
        .scroll-fab svg { width: 16px; height: 16px; }

        /* ═══════════════ Toast notifications ═══════════════ */
        .toast-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            align-items: center; pointer-events: none;
        }
        .toast {
            padding: 10px 20px; border-radius: var(--r-md); font-size: 0.875rem; font-weight: 500;
            color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1);
            pointer-events: auto; max-width: 360px; text-align: center;
        }
        .toast.success { background: #16A34A; }
        .toast.error { background: #DC2626; }
        .toast.info { background: var(--c-accent-dark); }
        .toast.fade-out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(8px); } }

        /* ═══════════════ Sidebar toggle icon rotation ═══════════════ */
        .sidebar-toggle svg { transition: transform 200ms ease; }
        .sidebar-toggle.rotated svg { transform: rotate(180deg); }

        /* ═══════════════ Animations ═══════════════ */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes msgIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
        @keyframes overlayIn { from { opacity: 0; transform: scale(0.98) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* ═══════════════ Responsive ═══════════════ */
        .sidebar-toggle {
            display: flex; align-items: center; justify-content: center;
            background: none; border: none; color: var(--c-text-secondary);
            width: 40px; height: 40px; border-radius: var(--r-sm); cursor: pointer;
            transition: background 120ms ease, color 120ms ease;
        }
        .sidebar-toggle:hover { color: var(--c-text); background: var(--c-surface-alt); }
        .sidebar-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            z-index: 150; opacity: 0; transition: opacity 0.2s ease;
        }
        .sidebar-backdrop.active { display: block; opacity: 1; }

        @media (max-width: 1024px) {
            .docs-panel { display: none; }
            .docs-panel.open {
                display: flex; position: fixed; right: 0; top: 56px; bottom: 0;
                z-index: 160; box-shadow: var(--c-shadow-lg);
                animation: slideInRight 0.25s cubic-bezier(0.16,1,0.3,1);
            }
        }
        @media (max-width: 768px) {
            .chat-sidebar {
                position: fixed; left: 0; top: 56px; bottom: 0; z-index: 160;
                transform: translateX(-100%); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
                box-shadow: var(--c-shadow-lg);
            }
            .chat-sidebar.open { transform: translateX(0); }
            .msg { max-width: 100%; }
            .msg-body { max-width: calc(100% - 44px); }
            .msg-avatar { width: 28px; height: 28px; }
            .msg-avatar svg { width: 13px; height: 13px; }
            .header-email, .header-divider, .usage-meter { display: none; }
            .app-header-inner { padding: 0 var(--sp-3); }
            .suggestion-chips { grid-template-columns: 1fr; }
            .suggestion-chip { white-space: normal; }
            .welcome { padding: var(--sp-8) var(--sp-3); }
            .welcome h2 { font-size: 1.25rem; }
            .auth-card { padding: var(--sp-6); }
            .doc-overlay { padding: var(--sp-3); }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* ═══════════════ Reduced motion ═══════════════ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ═══════════════ Print ═══════════════ */
        @media print {
            .app-header, .chat-sidebar, .docs-panel, .chat-input-wrap,
            .scroll-fab, .msg-feedback, .msg-actions, .feedback-form,
            .deep-banner, .limit-banner, .sidebar-backdrop,
            .announcement-banner, .sidebar-toggle, .welcome { display: none !important; }
            .chat-layout, .chat-messages, .chat-panel, .chat-wrap {
                height: auto !important; overflow: visible !important; display: block !important;
            }
            .msg { max-width: 100% !important; page-break-inside: avoid; }
            .msg-assistant .msg-content { border: none !important; box-shadow: none !important; }
            body { background: #fff !important; }
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }

        /* Shared admin navigation (single source — included via admin/_nav.html) */
        .admin-nav { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-6); flex-wrap: wrap; }
        .admin-nav a { font-size: 0.8125rem; font-weight: 500; padding: 6px 14px; border-radius: var(--r-full); color: var(--c-text-secondary); border: 1px solid var(--c-border); transition: all 150ms ease; text-decoration: none; }
        .admin-nav a:hover { background: var(--c-surface-alt); color: var(--c-text); text-decoration: none; }
        .admin-nav a.active { background: var(--c-brand); color: white; border-color: var(--c-brand); }
    </style>
    {% block head %}{% endblock %}
    <style>
    /* ── Stato vuoto: hero centrato + picker esperti (stile Google) ── */
    [hidden] { display: none !important; }

    .chat-panel.state-empty .chat-messages { display: none; }
    .chat-panel.state-empty .chat-wrap { justify-content: center; }
    .chat-panel.state-empty .chat-input-wrap { max-width: 720px; margin: 0 auto; width: 100%; }
    .chat-panel:not(.state-empty) .center-hero { display: none; }

    .center-hero {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: var(--sp-5); max-width: 760px; margin: 0 auto var(--sp-6); width: 100%;
        animation: fadeIn .4s ease-out;
        transition: opacity .3s ease, transform .3s ease;
    }
    .center-hero.hiding { opacity: 0; transform: translateY(-12px); pointer-events: none; }
    .center-hero-title {
        font-family: var(--font-serif); font-size: 1.9rem; font-weight: 600; line-height: 1.2;
    }
    .center-hero-sub { color: var(--c-text-secondary); font-size: .95rem; margin-top: calc(-1 * var(--sp-3)); }

    /* ── Card esperti ── */
    .agent-picker {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: var(--sp-3); width: 100%;
    }
    .agent-card {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: var(--sp-2); padding: var(--sp-4) var(--sp-3);
        border: 1.5px solid var(--c-border); border-radius: var(--r-lg);
        background: var(--c-surface); color: var(--c-text); cursor: pointer; font-family: inherit;
        transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }
    .agent-card:hover { border-color: var(--c-brand); transform: translateY(-2px); box-shadow: var(--c-shadow); }
    .agent-card--active { border-color: var(--c-brand); background: var(--c-brand-light); box-shadow: 0 0 0 2px var(--c-brand-light); }
    .agent-card-avatar {
        width: 88px; height: 88px; border-radius: var(--r-full); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: var(--c-surface-alt); border: 1px solid var(--c-border);
        font-size: 40px; line-height: 1;
    }
    .agent-card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .agent-card-name { font-weight: 700; font-size: 1.02rem; }
    .agent-card-tagline { font-weight: 400; color: var(--c-brand); font-size: .9rem; }
    .agent-card-role {
        font-size: .76rem; color: var(--c-text-secondary); line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Badge esperto (header, conversazione attiva) ── */
    .agent-badge {
        display: inline-flex; align-items: center; gap: var(--sp-2);
        padding: 3px 12px 3px 4px;
        border: 1px solid var(--c-border); border-radius: var(--r-full);
        background: var(--c-surface); color: var(--c-text);
        font-size: .82rem; font-weight: 600; white-space: nowrap;
    }
    .agent-badge-avatar { width: 24px; height: 24px; border-radius: var(--r-full); object-fit: cover; }

    @media (max-width: 720px) {
        .agent-picker { grid-template-columns: repeat(2, 1fr); }
        .center-hero-title { font-size: 1.5rem; }
        .agent-card-avatar { width: 72px; height: 72px; font-size: 34px; }
    }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="header-left">
                {% block nav_left %}{% endblock %}
                <a href="/chat" class="brand">
                    <img src="/static/img/logo.png" alt="SCAO" class="brand-logo">
                    <span>OS1 Docs</span>
                    <span class="beta-badge" title="Prodotto in fase BETA">Beta</span>
                </a>
            </div>
            <div class="header-right">
                {% block nav_right %}{% endblock %}
                <button class="theme-toggle" id="theme-toggle" aria-label="Cambia tema">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
    // ── Global toast ──
    function showToast(msg, type) {
        type = type || 'success';
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 300); }, 3000);
    }
    </script>
    <script>
    (function() {
        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('theme');
        if (saved) {
            html.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.setAttribute('data-theme', 'dark');
        }
        toggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    })();
    </script>
</body>
